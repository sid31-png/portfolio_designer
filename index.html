    <!--
      Second half of the GitHub Pages SPA redirect (see public/404.html):
      decode the ?/ path the 404 page encoded and restore a clean URL before
      React Router mounts, so deep links + refresh work on a static host.
    -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>

    <!--
      No-flash theme init: runs before first paint so the correct light/dark
      theme is applied immediately (reads saved choice, falls back to OS pref).
      Kept inline + tiny on purpose.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          // Dark-first (Magnetto): default to dark unless the user chose light.
          var dark = saved ? saved === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
