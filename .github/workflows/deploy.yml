name: Deploy to GitHub Pages

# Publishes the static portfolio export in public_site/ to GitHub Pages.
# No build step — this is Ahmed's pre-built static export; we upload it as-is.
# (Asset paths are prefixed for the /portfolio_designer/ project-page subpath.)
on:
  push:
    branches:
      - claude/portfolio-redesign-uxui-5tp1ra
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
