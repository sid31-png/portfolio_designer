<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ahmed Bouamama</title>
    <!--
      GitHub Pages SPA fallback (single-page-apps-for-github-pages technique).
      GitHub serves this 404.html for any unknown path (e.g. a refreshed deep
      link like /portfolio_designer/work/rch-crm). We encode the requested path
      into a query string and redirect to index.html, which decodes it back
      into a clean URL before React Router boots.

      pathSegmentsToKeep = 1 keeps the project-page base segment
      (/portfolio_designer/). Set to 0 for a user/root page or custom domain.
    -->
    <script>
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
